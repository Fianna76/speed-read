name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests and release APK
        run: ./gradlew lint test assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedRead-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
